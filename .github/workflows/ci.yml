name: husky

on:
    pull_request:
        types: [opened, reopened, synchronize]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pre-commit-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    pre-commit:
        name: pre-commit
        runs-on: blacksmith-2vcpu-ubuntu-2404
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11.23.0

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run husky checks
              run: CI=true ./.husky/pre-commit

            - name: Build workspace
              run: pnpm build

    all-green:
        name: all-green
        if: always()
        needs: [pre-commit]
        runs-on: blacksmith-2vcpu-ubuntu-2404
        steps:
            - name: Check for successful checks
              env:
                  PRE_COMMIT_RESULT: ${{ needs.pre-commit.result }}
              run: test "$PRE_COMMIT_RESULT" = "success"
