name: husky

on:
    pull_request:
        types: [opened, reopened, synchronize]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pre-commit-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    pre-commit:
        name: pre-commit
        runs-on: blacksmith-2vcpu-ubuntu-2404
        timeout-minutes: 15
        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oprc
            BETTER_AUTH_SECRET: test-secret-for-ci-only-must-be-at-least-32-characters
            BETTER_AUTH_URL: http://localhost:3000
            VITE_AUTH_URL: http://localhost:3000

        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: oprc
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_USER: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d oprc"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11.23.0

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Apply database migrations
              run: pnpm db:migrate

            - name: Run husky checks
              run: CI=true ./.husky/pre-commit

            - name: Run workspace tests
              run: pnpm test

            - name: Build workspace
              run: pnpm build

    all-green:
        name: all-green
        if: always()
        needs: [pre-commit]
        runs-on: blacksmith-2vcpu-ubuntu-2404
        steps:
            - name: Check for successful checks
              env:
                  PRE_COMMIT_RESULT: ${{ needs.pre-commit.result }}
              run: test "$PRE_COMMIT_RESULT" = "success"
