version: 2

updates:
    # Covers workspace package manifests, pnpm catalogs, and pnpm-lock.yaml.
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: daily
      commit-message:
          prefix: ⬆
      labels: [dependencies, internal]
      versioning-strategy: increase

    # Covers actions referenced from .github/workflows.
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: daily
      commit-message:
          prefix: ⬆
      labels: [dependencies, internal]
